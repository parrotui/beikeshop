```yaml
name: Build BeikeShop deployment ZIP

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支、tag 或 commit SHA，留空则使用当前分支'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 2. 配置 PHP 8.3
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, json, mbstring, openssl, pcntl, pdo_mysql, simplexml, tokenizer, xml, zip
          coverage: none

      # 3. 配置 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. 检查环境
      - name: Show build versions
        run: |
          php -v
          composer --version
          node --version
          npm --version

      # 5. 安装 PHP 生产依赖
      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # 6. 安装前端依赖
      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      # 7. 编译前端资源
      - name: Build frontend assets
        shell: bash
        run: |
          set -Eeuo pipefail

          node -e "const p=require('./package.json'); console.log('Available npm scripts:', p.scripts || {})"

          npm run prod

      # 8. 准备宝塔部署包
      - name: Prepare deployment package
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP_NAME="beikeshop-baota-php83-mysql80-${GITHUB_SHA::12}.zip"

          mkdir -p \
            dist/package/beikeshop/storage/framework/cache/data \
            dist/package/beikeshop/storage/framework/sessions \
            dist/package/beikeshop/storage/framework/views \
            dist/package/beikeshop/storage/logs \
            dist/package/beikeshop/bootstrap/cache

          rsync -a ./ dist/package/beikeshop/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.phpunit.cache/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='dist/'

          mkdir -p dist

          (
            cd dist/package
            zip -qr "../${ZIP_NAME}" beikeshop
          )

          sha256sum "dist/${ZIP_NAME}" > dist/SHA256SUMS.txt

          echo "Deployment package created:"
          ls -lh "dist/${ZIP_NAME}" dist/SHA256SUMS.txt

      # 9. 上传构建产物
      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: beikeshop-baota-php83-mysql80-${{ github.sha }}
          path: |
            dist/beikeshop-baota-php83-mysql80-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
```
