from pathlib import Path
import zipfile, os

root = Path("/mnt/data/beikeshop-github-actions-fix")
wf = root / ".github" / "workflows"
wf.mkdir(parents=True, exist_ok=True)

content = r"""name: Build BeikeShop deployment ZIP

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支、tag 或 commit SHA；留空则构建当前触发的版本'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, json, mbstring, openssl, pcntl, pdo_mysql, simplexml, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Show build versions
        run: |
          php -v
          composer --version
          node --version
          npm --version

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run prod

      - name: Prepare deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/package
          rsync -a ./ dist/package/beikeshop/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.phpunit.cache/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='dist/'
          mkdir -p \
            dist/package/beikeshop/storage/framework/cache/data \
            dist/package/beikeshop/storage/framework/sessions \
            dist/package/beikeshop/storage/framework/views \
            dist/package/beikeshop/storage/logs \
            dist/package/beikeshop/bootstrap/cache
          cd dist/package
          ZIP_NAME="beikeshop-baota-php83-mysql80-${GITHUB_SHA::12}.zip"
          zip -qr "../${ZIP_NAME}" beikeshop
          cd ../..
          sha256sum "${ZIP_NAME}" > SHA256SUMS.txt
          mv "${ZIP_NAME}" dist/

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: beikeshop-baota-php83-mysql80-${{ github.sha }}
          path: |
            dist/beikeshop-baota-php83-mysql80-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
"""
(root / ".github" / "workflows" / "build-release.yml").write_text(content, encoding="utf-8")
readme = """# BeikeShop GitHub Actions 工作流修正版

请用本包中的 `.github/workflows/build-release.yml` 完整替换你仓库里的同名文件，不要只替换几行。

关键修正：把 YAML 的 `on:` 写成 `'on':`，避免部分 YAML 1.1 解析器将 `on` 识别为布尔值。GitHub Actions 支持该写法。

操作：
1. 在 GitHub 仓库打开 `.github/workflows/build-release.yml`。
2. 点击铅笔编辑按钮。
3. 全选并替换为此包里的完整文件内容。
4. Commit changes。
5. 进入 Actions 再运行工作流。

注意：如果 YAML 错误消失但后续构建失败，需看 Actions 运行日志。源码仓库的实际 `package.json` 是否提供 `npm run prod`、是否存在 `package-lock.json`，以及 Composer 依赖是否可在 PHP 8.3 下安装，仍需由首次构建日志验证。
"""
(root / "README.md").write_text(readme, encoding="utf-8")
out = "/mnt/data/beikeshop-github-actions-workflow-fixed.zip"
with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
    z.write(root / "README.md", "README.md")
    z.write(root / ".github" / "workflows" / "build-release.yml", ".github/workflows/build-release.yml")
print(out, os.path.getsize(out))
