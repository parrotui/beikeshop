import os, zipfile, textwrap

root = "/mnt/data/beikeshop-github-actions"
workflow_dir = os.path.join(root, ".github", "workflows")
os.makedirs(workflow_dir, exist_ok=True)

workflow = r"""name: Build BeikeShop deployment ZIP

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支、tag 或 commit SHA（留空则构建当前触发的版本）"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, json, mbstring, openssl, pcntl, pdo_mysql, simplexml, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show build versions
        run: |
          php -v
          composer --version
          node --version
          npm --version

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run prod

      - name: Prepare deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/package
          rsync -a ./ dist/package/beikeshop/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.phpunit.cache/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='dist/'
          mkdir -p \
            dist/package/beikeshop/storage/framework/cache/data \
            dist/package/beikeshop/storage/framework/sessions \
            dist/package/beikeshop/storage/framework/views \
            dist/package/beikeshop/storage/logs \
            dist/package/beikeshop/bootstrap/cache
          cd dist/package
          zip -qr "../beikeshop-baota-php83-mysql80-${GITHUB_SHA::12}.zip" beikeshop
          cd ../..
          sha256sum "beikeshop-baota-php83-mysql80-${GITHUB_SHA::12}.zip" > SHA256SUMS.txt
          mv "beikeshop-baota-php83-mysql80-${GITHUB_SHA::12}.zip" dist/

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: beikeshop-baota-php83-mysql80-${{ github.sha }}
          path: |
            dist/beikeshop-baota-php83-mysql80-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
"""

with open(os.path.join(workflow_dir, "build-release.yml"), "w", encoding="utf-8", newline="\n") as f:
    f.write(workflow)

readme = """# BeikeShop GitHub Actions 打包工作流

将 `.github/workflows/build-release.yml` 加入你自己的 BeikeShop Fork 仓库。

## 使用

1. Fork 官方仓库：https://github.com/beikeshop/beikeshop
2. 将本压缩包中的 `.github/workflows/build-release.yml` 放入 Fork 仓库相同路径，并提交。
3. 打开 GitHub 仓库的 **Actions** 页面，选择 **Build BeikeShop deployment ZIP**。
4. 点击 **Run workflow**，一般保持 ref 为空即可构建当前分支；也可填写已存在的分支、tag 或 commit SHA。
5. 任务成功后进入本次运行页面底部的 **Artifacts**，下载 `beikeshop-baota-php83-mysql80-...`。
6. 解压 ZIP 后，项目位于 `beikeshop/` 文件夹；上传宝塔后将网站运行目录设置为 `beikeshop/public`。

给仓库推送 `v*` 格式的 tag（例如 `v-test1`）也会触发构建。生产环境建议只对已验证的 tag 构建。

## 工作流做什么

- GitHub-hosted Ubuntu runner
- PHP 8.3 + Composer 2
- Node.js 20 + `npm ci`
- `composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader`
- `npm run prod`
- 排除 `.git`、`.env`、`node_modules`、测试目录和运行时缓存/日志
- 上传 ZIP 和 SHA-256 校验文件作为 Actions Artifact

## 为什么不在 Actions 中执行 `php artisan beikeshop:install`

安装命令涉及目标数据库和实际站点初始化，不应该在打包阶段对一个不存在或非目标的数据库执行。请在宝塔上配置 PHP 8.3、MySQL 8.0、`.env` 和目录权限，再通过 BeikeShop 官方浏览器安装向导初始化。不要把 `.env`、数据库密码、APP_KEY 或 API 密钥提交到 GitHub。

## 宝塔部署提示

- PHP 8.3 所需扩展请按官方文档核对，尤其 `fileinfo`。
- 官方文档要求从 PHP 禁用函数中移除 `putenv` 和 `proc_open`。
- 网站运行目录设置为项目 `public` 子目录；Nginx 需配置 Laravel/BeikeShop 伪静态。
- MySQL 8.0 符合官方文档所列 MySQL 5.7+ 基础要求。
- 本工作流打包的是源码和依赖，不包含数据库、`.env` 或已经安装完成的站点数据。
- 若官方项目的 `package.json` 脚本名称、依赖或构建要求改变，需要同步调整工作流。

官方仓库：https://github.com/beikeshop/beikeshop
官方源码安装说明：https://docs.beikeshop.com/install/source.html
"""
with open(os.path.join(root, "README.md"), "w", encoding="utf-8") as f:
    f.write(readme)

out = "/mnt/data/beikeshop-github-actions-workflow.zip"
with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
    z.write(os.path.join(root, "README.md"), "README.md")
    z.write(os.path.join(workflow_dir, "build-release.yml"), ".github/workflows/build-release.yml")

print(out, os.path.getsize(out))
